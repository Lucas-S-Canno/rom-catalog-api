apiVersion: apps/v1
kind: Deployment
metadata:
  name: rom-catalog-api
  namespace: rom-catalog
  labels:
    app.kubernetes.io/name: rom-catalog-api
    app.kubernetes.io/part-of: rom-catalog
spec:
  # Single replica: Flyway runs on boot and there is no leader election. Bump only
  # after moving migrations to an initContainer/Job (see k8s/README.md).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rom-catalog-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rom-catalog-api
        app.kubernetes.io/part-of: rom-catalog
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Needed only while the GHCR package is private. Harmless if it is public
      # (kubelet just ignores a pull secret it cannot use). See k8s/README.md.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/lucas-s-canno/rom-catalog-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: rom-catalog-api-config
            - secretRef:
                name: rom-catalog-api-secret
          # Give Flyway + JVM warmup time before liveness kicks in.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
