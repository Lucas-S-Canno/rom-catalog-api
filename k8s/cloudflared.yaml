# Cloudflare Tunnel sidecar-as-Deployment. Exposes the API (and the MinIO console
# for the phone, per decision D-02) over HTTPS without opening any inbound port.
#
# Prereqs (done once, outside the cluster):
#   cloudflared tunnel login
#   cloudflared tunnel create rom-catalog
#   cloudflared tunnel route dns rom-catalog api.lucascanno.com.br
#   cloudflared tunnel route dns rom-catalog storage.lucascanno.com.br
#   kubectl -n rom-catalog create secret generic tunnel-credentials \
#     --from-file=credentials.json=$HOME/.cloudflared/<TUNNEL_ID>.json
# Then set TUNNEL_ID below and `kubectl apply -f k8s/cloudflared.yaml`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: rom-catalog
data:
  config.yaml: |
    tunnel: REPLACE_WITH_TUNNEL_ID
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: api.lucascanno.com.br
        service: http://rom-catalog-api.rom-catalog.svc.cluster.local:80
      - hostname: storage.lucascanno.com.br
        service: http://minio.storage.svc.cluster.local:9000
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: rom-catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2024.10.0
          args: ["tunnel", "--config", "/etc/cloudflared/config/config.yaml", "run"]
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: tunnel-credentials
