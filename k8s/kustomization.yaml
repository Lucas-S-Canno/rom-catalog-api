apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rom-catalog

resources:
  # namespace.yaml is intentionally NOT here — Fleet/Helm can't adopt a
  # pre-existing namespace. The namespace is created by the k8s/infra bundle
  # (fleet.yaml `namespace:`) or `kubectl create namespace rom-catalog`.
  - configmap.yaml
  - service.yaml
  - deployment.yaml
  - ingress.yaml        # host routing for an external cloudflared via Traefik
#  - cloudflared.yaml   # only if you run cloudflared INSIDE the cluster
  # secret.example.yaml is a template — apply the real Secret separately
  # (see k8s/README.md). It is intentionally not listed here.

# newTag is bumped automatically by .github/workflows/ci.yml (job `update-manifest`)
# on every push to main — CI publishes ghcr.io/.../rom-catalog-api:<sha> and commits
# the new tag here; Fleet (kustomize) then rolls the Deployment. Pinning to an
# immutable <sha> instead of `latest` is what makes `imagePullPolicy: IfNotPresent`
# actually pick up new builds. Do not hand-edit outside a bootstrap.
images:
  - name: ghcr.io/lucas-s-canno/rom-catalog-api
    newTag: fd9ee321f3f68defa04b2f2354f7f67b8301abde
