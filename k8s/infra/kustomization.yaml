apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rom-catalog

# In-cluster Postgres + MinIO for the homelab. Optional — skip this whole
# directory if you already run Postgres/MinIO elsewhere (see k8s/README.md).
# Prereqs applied separately: the `rom-catalog` namespace and the
# `rom-catalog-data-secret` (see secret.example.yaml and the runbook).
resources:
  - postgres.yaml
  - minio.yaml
  - create-bucket-job.yaml
