# Creates the `roms` bucket. Run as a HELM HOOK, not a tracked resource: Fleet
# renders bundles through Helm, so `helm.sh/hook` makes this Job run once per
# sync (mc mb is idempotent) and then get deleted — Helm/Fleet never tracks it
# for drift, which is what caused the endless "object has been modified" conflict
# on the bundle (a Job's spec is immutable, so re-applying it always fails).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: rom-catalog
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-08T15-39-49Z
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio..."; sleep 3
              done
              mc mb --ignore-existing local/roms
              mc ls local
          envFrom:
            - secretRef:
                name: rom-catalog-data-secret
