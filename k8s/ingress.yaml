# Host-based routing for an EXTERNAL cloudflared (running with config.yml on a
# homelab host, outside the cluster). It cannot resolve *.svc.cluster.local, so
# it hits the cluster's ingress controller (Traefik on K3s, :80) which routes by
# Host header to these Services.
#
# In cloudflared's config.yml, point BOTH hostnames at your Traefik target
# (the same `service:` URL your other apps already use), e.g.:
#   - hostname: rom-catalog-api.lucascanno.com.br
#     service: http://<k3s-node-ip>:80
#   - hostname: rom-catalog-storage.lucascanno.com.br
#     service: http://<k3s-node-ip>:80
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rom-catalog-api
  namespace: rom-catalog
spec:
  rules:
    - host: rom-catalog-api.lucascanno.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rom-catalog-api
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-s3
  namespace: rom-catalog
  annotations:
    # web: plain HTTP, for the external-cloudflared path above (Cloudflare
    # terminates TLS at its edge and forwards plain HTTP here). websecure: lets
    # this same host also be reached with a browser-trusted cert DIRECTLY on the
    # LAN (bypassing the Tunnel, e.g. via a hosts-file/local-DNS override) — that
    # bypass is what makes POST /admin/roms/presign-upload's PUT able to skip
    # Cloudflare's request-size cap for big ROMs (see docs/API.md). Needs
    # k8s/storage-tls-certificate.yaml applied (cert-manager + a ClusterIssuer,
    # see k8s/cloudflare-dns01-issuer.yaml) — until then, websecure just serves
    # Traefik's default self-signed cert, which browsers correctly reject.
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - rom-catalog-storage.lucascanno.com.br
      secretName: rom-catalog-storage-tls
  rules:
    - host: rom-catalog-storage.lucascanno.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
