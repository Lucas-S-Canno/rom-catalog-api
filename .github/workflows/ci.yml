name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships a running Docker daemon, which Testcontainers uses
      # for the Postgres + MinIO integration/route tests.
      - name: Build and run the full test suite
        run: ./gradlew build test --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          if-no-files-found: ignore

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /usr/local/bin kubeconform

      - name: Render kustomize
        run: |
          kubectl kustomize k8s/ > /tmp/app.yaml
          kubectl kustomize k8s/infra/ > /tmp/infra.yaml
          cat /tmp/app.yaml /tmp/infra.yaml

      - name: Validate against the Kubernetes schemas
        run: |
          kubeconform -strict -summary -ignore-missing-schemas k8s/
          kubeconform -strict -summary -ignore-missing-schemas /tmp/app.yaml /tmp/infra.yaml

  image:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rom-catalog-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: bash scripts/smoke.sh rom-catalog-api:ci

  publish:
    runs-on: ubuntu-latest
    needs: [build-test, manifests, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase the repository owner (GHCR requires it)
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/rom-catalog-api:latest
            ghcr.io/${{ env.OWNER_LC }}/rom-catalog-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
