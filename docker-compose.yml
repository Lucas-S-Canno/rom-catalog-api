services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: romcatalog
      POSTGRES_PASSWORD: romcatalog
      POSTGRES_DB: romcatalog
    ports:
      # Override with POSTGRES_HOST_PORT if 5432 is taken on your machine
      # (e.g. a native PostgreSQL service).
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata: